<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Campus Anatomía de un LLM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Maqueta: portada tipográfica a ancho completo (como la de los apuntes), barra de menú con las cinco fases y área de trabajo a ancho completo. Tipografía Computer Modern. */
:root{
  --papel:#fdfdfb; --papel-2:#f3f3ef; --tinta:#141414; --tinta-2:#55575c; --regla:#cfcfc9;
  --acento:#143278; --acento-2:#e8ecf5; --enlace:#143278;
  --bien:#1f5f2e; --mal:#8e1d1d;
  --lienzo:#e6e6e1; --sombra:0 1px 2px rgba(0,0,0,.10),0 3px 10px rgba(0,0,0,.07);
  --serif:"CMU Serif","Latin Modern Roman","Computer Modern",Georgia,serif;
  --mono:"CMU Typewriter Text","Latin Modern Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --papel:#16171a; --papel-2:#1e2024; --tinta:#e9e8e3; --tinta-2:#a9adb3; --regla:#33363c;
  --acento:#9db4e8; --acento-2:#1d2433; --enlace:#9db4e8; --bien:#86c895; --mal:#ef9a9a;
  --lienzo:#0f1012; --sombra:0 1px 2px rgba(0,0,0,.5),0 3px 10px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --papel:#16171a; --papel-2:#1e2024; --tinta:#e9e8e3; --tinta-2:#a9adb3; --regla:#33363c;
  --acento:#9db4e8; --acento-2:#1d2433; --enlace:#9db4e8; --bien:#86c895; --mal:#ef9a9a;
  --lienzo:#0f1012; --sombra:0 1px 2px rgba(0,0,0,.5),0 3px 10px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--papel);color:var(--tinta)}
body{margin:0;font-family:var(--serif);font-size:18px;line-height:1.5;-webkit-font-smoothing:antialiased;font-kerning:normal}
a{color:var(--enlace);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:2px}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:1.5px solid var(--acento);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.2;text-wrap:balance;margin:0}
.sc,.eti{font-variant:small-caps;letter-spacing:.06em}
.eti{font-size:.95rem;color:var(--tinta-2);font-weight:400}
.num{font-variant-numeric:tabular-nums lining-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--papel)}
.ancho{max-width:1500px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Portada */
.portada{padding-block:22px 0;text-align:center}
.portada .linea1{font-variant:small-caps;letter-spacing:.12em;font-size:1rem;color:var(--tinta-2)}
.portada h1{font-size:clamp(1.7rem,3.6vw,2.5rem);margin:6px 0 4px;letter-spacing:.01em}
.portada .linea2{font-style:italic;color:var(--tinta-2);font-size:1.02rem}
.regla-gruesa{border:0;border-top:1.6px solid var(--tinta);margin:16px 0 0}
.regla-fina{border:0;border-top:.6px solid var(--tinta);margin:3px 0 0}

/* Menú superior */
.menu{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--papel);border-bottom:.6px solid var(--tinta)}
.menu-in{display:flex;flex-wrap:wrap;justify-content:center;gap:0 4px}
.menu a.item,.menu summary{display:block;padding:10px 14px;color:var(--tinta);font-variant:small-caps;letter-spacing:.08em;font-size:1.05rem;cursor:pointer;list-style:none;border-bottom:2px solid transparent}
.menu summary::-webkit-details-marker{display:none}
.menu summary::after{content:" ▾";font-size:.7em;color:var(--tinta-2)}
.menu a.item:hover,.menu summary:hover{text-decoration:none;color:var(--acento)}
.menu [aria-current="page"],.menu details.actual>summary{color:var(--acento);border-bottom-color:var(--acento)}
.menu details{position:relative}
.desp{position:absolute;left:50%;transform:translateX(-50%);top:100%;min-width:24rem;max-width:min(92vw,30rem);background:var(--papel);border:.6px solid var(--tinta);box-shadow:var(--sombra);padding:12px 0 8px;z-index:25}
.desp .cab-desp{padding:0 18px 8px;border-bottom:.6px solid var(--regla);margin-bottom:6px}
.desp .cab-desp b{display:block;font-size:1rem}
.desp a{display:grid;grid-template-columns:3.4em 1fr;gap:6px;padding:5px 18px;color:var(--tinta);line-height:1.3}
.desp a:hover{background:var(--papel-2);text-decoration:none}
.desp a[aria-current="page"]{color:var(--acento)}
.desp a .n{color:var(--tinta-2);font-variant-numeric:tabular-nums}
.desp a.hito{border-top:.6px solid var(--regla);margin-top:6px;padding-top:9px;font-style:italic}
@media (max-width:760px){
  .menu{position:static}
  .menu-in{justify-content:flex-start}
  .menu a.item,.menu summary{padding:8px 10px;font-size:1rem}
  .desp{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));transform:none;top:auto;min-width:0;max-width:none;margin-top:4px}
}

/* Cuerpo */
.principal{padding-block:28px 64px}
.lectura{max-width:44rem}
.lectura p{margin:.6em 0;text-align:justify;hyphens:auto}
.titular{margin-bottom:20px}
.titular .eti{display:block}
.titular h2{font-size:clamp(1.6rem,3vw,2.3rem);margin:4px 0 8px}
.titular .meta{color:var(--tinta-2);display:flex;gap:6px 18px;flex-wrap:wrap;font-size:.98rem}
.titular .meta span+span::before{content:"·";margin-right:18px;color:var(--regla)}
.titular .meta span{display:inline-flex}
.titular hr{border:0;border-top:.6px solid var(--tinta);margin:14px 0 0}
.pestanas{display:flex;gap:2px;border-bottom:.6px solid var(--regla);margin-bottom:20px;overflow-x:auto}
.pestanas button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 14px;font-variant:small-caps;letter-spacing:.07em;font-size:1.05rem;color:var(--tinta-2);cursor:pointer;white-space:nowrap}
.pestanas button[aria-selected="true"]{color:var(--acento);border-bottom-color:var(--acento)}
.boton{display:inline-flex;align-items:center;gap:6px;border:.6px solid var(--tinta-2);background:var(--papel);padding:4px 12px;border-radius:2px;cursor:pointer;color:var(--tinta);font-size:.95rem;white-space:nowrap}
.boton:hover{border-color:var(--tinta);background:var(--papel-2)}
.boton.prim{background:var(--acento);border-color:var(--acento);color:var(--papel)}
.boton[disabled]{opacity:.5;cursor:default}
.fila{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
table.t{border-collapse:collapse;width:100%;font-size:.98rem}
table.t th{font-weight:400;font-variant:small-caps;letter-spacing:.07em;text-align:left;border-top:1.4px solid var(--tinta);border-bottom:.6px solid var(--tinta);padding:6px 10px;color:var(--tinta)}
table.t td{padding:6px 10px;vertical-align:top;border-bottom:.4px solid var(--regla)}
table.t tr:last-child td{border-bottom:1.4px solid var(--tinta)}
table.t tr.grupo td{border-bottom:.6px solid var(--tinta);padding-top:18px;font-weight:700}
.tabla{overflow-x:auto}
.aviso{border-left:2px solid var(--acento);background:var(--papel-2);padding:10px 16px;font-size:.98rem;margin:12px 0}
.estrellas{letter-spacing:1px;white-space:nowrap;color:var(--tinta)}
.vacio{color:var(--tinta-2);font-style:italic}
h3.sec{font-size:1.25rem;margin:30px 0 10px}
h3.sec .n{margin-right:.6em}
.columnas{display:grid;grid-template-columns:minmax(0,44rem) minmax(0,1fr);gap:40px;align-items:start}
@media (max-width:1000px){.columnas{grid-template-columns:minmax(0,1fr)}}
.ficha-curso{border-top:1.4px solid var(--tinta);border-bottom:1.4px solid var(--tinta);padding:10px 0}
.ficha-curso dl{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:0}
.ficha-curso dt{font-variant:small-caps;letter-spacing:.06em;color:var(--tinta-2)}
.ficha-curso dd{margin:0}

/* Visor PDF */
.visor{border:.6px solid var(--tinta-2);background:var(--lienzo);display:grid;grid-template-columns:auto minmax(0,1fr);height:min(84vh,1150px);min-height:420px;position:relative}
.visor-barra{grid-column:1/-1;display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 8px;background:var(--papel);border-bottom:.6px solid var(--tinta-2)}
.visor-barra input{width:3.6em;text-align:right;padding:2px 4px;border:.6px solid var(--tinta-2);border-radius:2px;background:var(--papel)}
.visor-barra .sep{flex:1}
.visor.completa{position:fixed;inset:0;z-index:1000;height:100vh;height:100dvh;max-height:none;border:0}
.visor:fullscreen{height:100vh;max-height:none;border:0}
body.visor-abierto{overflow:hidden}
.visor-ind{grid-column:1;grid-row:2;width:300px;overflow:auto;background:var(--papel);border-right:.6px solid var(--tinta-2);padding:10px 8px;font-size:.95rem}
.visor-ind ul{list-style:none;margin:0;padding-left:14px}
.visor-ind>ul{padding-left:0}
.visor-ind a{display:block;padding:3px 6px;color:var(--tinta);line-height:1.3}
.visor-ind a:hover{background:var(--papel-2);text-decoration:none}
.visor-pags{grid-column:2;grid-row:2;overflow:auto;padding:18px;display:flex;flex-direction:column;align-items:center;gap:16px;min-width:0}
.pg{position:relative;background:#fff;box-shadow:var(--sombra);flex:none}
.pg canvas{display:block;width:100%;height:100%}
.pg a.lk{position:absolute;display:block;background:transparent}
.pg a.lk:hover{background:rgba(20,50,120,.12);outline:1px solid rgba(20,50,120,.4);text-decoration:none}
.nota-resumen{font-family:var(--sans);font-size:.88rem;color:var(--tinta-2);margin:0 0 10px}
.visor-estado{color:var(--tinta-2);padding:30px;text-align:center;font-style:italic}
@media (max-width:700px){.visor{grid-template-columns:minmax(0,1fr);height:78vh}.visor-pags{grid-column:1}.visor-ind{position:absolute;z-index:3;top:46px;height:60vh;box-shadow:var(--sombra)}}

/* Cuaderno */
.celda{margin:14px 0}
.celda-md{max-width:44rem}
.celda-md code{font-family:var(--mono);font-size:.92em}
.celda-md pre{overflow-x:auto;background:var(--papel-2);padding:10px}
.celda-md table{border-collapse:collapse;margin:10px 0;font-size:.95rem}
.celda-md th,.celda-md td{padding:4px 12px;text-align:left;border-bottom:.4px solid var(--regla)}
.celda-md th{border-top:1.2px solid var(--tinta);border-bottom:.6px solid var(--tinta);font-weight:400;font-variant:small-caps;letter-spacing:.06em}
.celda-cod{border:.6px solid var(--regla);background:var(--papel-2)}
.celda-cod .cb{display:flex;justify-content:space-between;align-items:center;padding:3px 8px;color:var(--tinta-2);border-bottom:.6px solid var(--regla);font-size:.9rem}
.celda-cod textarea{display:block;width:100%;border:0;background:transparent;font-family:var(--mono);font-size:.88rem;line-height:1.5;padding:10px 12px;resize:vertical;white-space:pre;overflow:auto;tab-size:4;min-height:3em}
.salida{border-top:.6px dashed var(--regla);padding:8px 12px;font-family:var(--mono);font-size:.85rem;white-space:pre-wrap;overflow-x:auto;background:var(--papel)}
.salida.err{color:var(--mal)}
.salida img{max-width:100%;background:#fff;display:block;margin:6px 0}
.motor{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 12px}
.luz{width:8px;height:8px;border-radius:50%;background:var(--tinta-2);display:inline-block}
.luz.on{background:var(--bien)} .luz.busy{background:#b07d12} .luz.err{background:var(--mal)}

/* Test y tarjetas */
.preg{border-top:.4px solid var(--regla);padding:14px 0}
.preg .enun{display:flex;gap:10px}
.preg .enun b{min-width:2em}
.opc{display:grid;gap:2px;margin:8px 0 0 2.6em}
.opc label{display:flex;gap:8px;align-items:baseline;padding:3px 8px;cursor:pointer}
.opc label:hover{background:var(--papel-2)}
.opc label.ok{background:color-mix(in srgb,var(--bien) 14%,transparent)}
.opc label.ko{background:color-mix(in srgb,var(--mal) 14%,transparent)}
.resp-num{margin:8px 0 0 2.6em;display:flex;gap:8px;align-items:center}
.resp-num input{width:9em;padding:3px 6px;border:.6px solid var(--tinta-2);border-radius:2px;background:var(--papel)}
.expl{margin:8px 0 0 2.6em;font-size:.97rem;color:var(--tinta-2)}
.e-bien{color:var(--bien)} .e-mal{color:var(--mal)}
.marcador{position:sticky;bottom:0;background:var(--papel);border-top:1.4px solid var(--tinta);padding:10px 0;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.ficha{max-width:40rem;min-height:15rem;border-top:1.4px solid var(--tinta);border-bottom:1.4px solid var(--tinta);background:var(--papel);display:grid;place-items:center;text-align:center;padding:28px;cursor:pointer;font-size:1.2rem}
.ficha .eti{display:block;margin-bottom:12px}
@media (prefers-reduced-motion:no-preference){.pestanas button,.boton,.menu a,.menu summary{transition:background .15s,color .15s,border-color .15s}}
</style>

<script>
"use strict";
/* ------------------------------------------------------------------ utilidades */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const h=(tag,attrs={},...kids)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs||{})){if(v==null||v===false)continue;if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?'':v)}for(const k of kids.flat()){if(k==null||k===false)continue;e.append(k.nodeType?k:document.createTextNode(String(k)))}return e};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const tipografiar=el=>new Promise(r=>requestAnimationFrame(()=>{try{if(el&&el.isConnected&&el.getClientRects().length&&window.MathJax&&MathJax.typesetPromise){MathJax.typesetPromise([el]).catch(()=>{}).then(r);return}}catch{}r()}));
const estrellas=n=>'★'.repeat(n)+'☆'.repeat(3-n);
const ROM={F1:'I',F2:'II',F3:'III',F4:'IV',F5:'V'};

/* ------------------------------------------------------------------ estado */
const S={datos:null,tests:{},testsH:{},descargas:null};
const modulo=id=>S.datos.modulos.find(m=>m.id===id);
const cod=m=>m.fase==='F0'?m.etiqueta:'M'+String(m.n).padStart(2,'0');
const hito=id=>S.datos.hitos.find(x=>x.id===id);
const fase=id=>S.datos.fases.find(f=>f.id===id);

/* ------------------------------------------------------------------ preferencias locales */
const BASE_LOCAL='campus-llm-';
function aviso(t){const a=h('div',{class:'aviso',role:'status'},t);const p=$('#principal');p.prepend(a);setTimeout(()=>a.remove(),5000)}

/* ------------------------------------------------------------------ descargas */
function guardarLocal(blob,nombre){const u=URL.createObjectURL(blob);const a=h('a',{href:u,download:nombre});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
async function descargar(ruta,nombre,boton){
  try{
    if(!S.descargas&&window.claude&&claude.use)S.descargas=await claude.use('downloads');
    if(boton){boton.disabled=true}
    const r=await fetch(ruta); if(!r.ok)throw new Error('http');
    const blob=await r.blob();
    if(S.descargas)await S.descargas.save({filename:nombre,data:blob});else guardarLocal(blob,nombre);
  }catch(e){
    if(e&&e.code==='declined')return;
    if(e&&e.code==='rate_limited'){aviso('Ya hay una descarga pendiente de confirmar.');return}
    aviso('No se pudo descargar el archivo.');
  }finally{if(boton)boton.disabled=false}
}
const botonDescarga=(ruta,nombre,texto)=>{const b=h('button',{class:'boton',type:'button'},texto||'Descargar');b.addEventListener('click',()=>descargar(ruta,nombre,b));return b};
/* paquetes .zip generados en el navegador: entradas = [[ruta publicada, nombre dentro del zip], …] */
async function descargarZip(nombre,entradas,boton){
  const txt=boton?boton.textContent:'';
  try{
    if(!S.descargas&&window.claude&&claude.use)S.descargas=await claude.use('downloads');
    if(!window.JSZip){aviso('No se pudo preparar el archivo comprimido.');return}
    if(boton)boton.disabled=true;

/* protege $…$ del procesador de Markdown */
let MATES=[];
function protegerMates(s){MATES=[];return s.replace(/\$\$[\s\S]+?\$\$|\$[^$\n]+?\$/g,m=>{MATES.push(m);return '@@M'+(MATES.length-1)+'@@'})}
function restaurarMates(el){const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);const ns=[];while(w.nextNode())ns.push(w.currentNode);for(const n of ns)if(n.nodeValue.includes('@@M'))n.nodeValue=n.nodeValue.replace(/@@M(\d+)@@/g,(_,i)=>MATES[+i])}

      h('tbody',{},(pl.sesiones||[]).map(s=>h('tr',{style:s.fecha===hoy?'background:var(--acento-2)':null},h('td',{style:'white-space:nowrap'},soloFecha(s.fecha)),h('td',{class:'num'},s.horario||'18:00–20:00'),h('td',{},s.enlace?h('a',{href:s.enlace},s.titulo):s.titulo),h('td',{},h('ul',{style:'margin:0;padding-left:1.1em'},(s.tareas||[]).map(t=>h('li',{},t))))))))),
    (pl.recomendaciones&&pl.recomendaciones.length)?h('div',{class:'aviso'},h('i',{},'Recomendaciones del tutor. '),pl.recomendaciones.join(' ')):null);

function estadoConv(c,ahora=Date.now()){
  const a=Date.parse(c.apertura),z=Date.parse(c.cierre||new Date(a+(c.duracion_min||120)*60000).toISOString());
  const it=T.intentos[c.id];
  if(it&&it.estado==='entregado')return 'entregada';
  if(ahora<a)return 'proxima'; if(ahora>=z)return it&&it.inicio?'entregada':'cerrada'; return it&&it.inicio?'en curso':'abierta';
}
const NOMBRE_ESTADO={proxima:'Próxima',abierta:'Abierta',['en curso']:'En curso',entregada:'Entregada',cerrada:'Cerrada sin presentar'};
function vistaConvocatorias(){
  const p=$('#principal');
  const cab=h('div',{class:'titular'},h('span',{class:'eti'},'Evaluación con ventana horaria'),h('h2',{},'Convocatorias'),h('div',{class:'meta'},h('span',{},'Exámenes generados por el tutor; cada uno solo puede hacerse dentro de su ventana.')),h('hr'));

  if(!T.convs.length){p.replaceChildren(cab,h('p',{class:'vacio'},'Todavía no hay convocatorias. El tutor las publica con el plan semanal.'));return}
  const filas=T.convs.slice().reverse().map(c=>{const e=estadoConv(c);const it=T.intentos[c.id];
    return h('tr',{},h('td',{},h('a',{href:'#convocatorias-'+c.id},c.titulo)),h('td',{},(c.modulos||[]).join(', ')),h('td',{style:'white-space:nowrap'},fechaHora(c.apertura)),h('td',{class:'num'},(c.duracion_min||'—')+' min'),h('td',{},NOMBRE_ESTADO[e]),h('td',{class:'num'},it&&it.estado==='entregado'?fmt(it.puntos)+' / '+fmt(it.total):'—'))});
  p.replaceChildren(cab,h('div',{class:'tabla'},h('table',{class:'t'},h('thead',{},h('tr',{},h('th',{},'Convocatoria'),h('th',{},'Módulos'),h('th',{},'Apertura'),h('th',{},'Duración'),h('th',{},'Estado'),h('th',{},'Nota'))),h('tbody',{},filas))));

function vistaConvocatoria(id){
  const p=$('#principal');const c=T.convs.find(x=>x.id===id);
  if(!c){vistaConvocatorias();return}
  const e=estadoConv(c);const it=T.intentos[id]||{};
  const a=Date.parse(c.apertura),z=Date.parse(c.cierre||new Date(a+(c.duracion_min||120)*60000).toISOString());
  const cab=h('div',{class:'titular'},h('span',{class:'eti'},'Convocatoria'),h('h2',{},c.titulo),h('div',{class:'meta'},h('span',{},'Abre: '+fechaHora(c.apertura)),h('span',{},'Cierra: '+fechaHora(new Date(z).toISOString())),h('span',{class:'num'},'Duración: '+(c.duracion_min||Math.round((z-a)/60000))+' min'),h('span',{},'Aprobado: '+Math.round(100*(c.umbral||0.7))+' %')),h('hr'));
  const cuerpo=h('div');
  if(c.descripcion)cuerpo.append(h('p',{class:'lectura'},c.descripcion));
  if(e==='proxima'){
    const cuenta=h('p',{class:'num',style:'font-size:1.3rem'});
    const tic=()=>{const d=a-Date.now();if(d<=0){clearInterval(iv);vistaConvocatoria(id);return}const hh=Math.floor(d/3.6e6),mm=Math.floor(d%3.6e6/6e4),ss=Math.floor(d%6e4/1e3);cuenta.textContent='Se abre en '+(hh?hh+' h ':'')+mm+' min '+ss+' s.'};
    const iv=setInterval(tic,1000);tic();T.limpiar=()=>clearInterval(iv);

  }else if(e==='abierta'){
    const b=h('button',{class:'boton prim',type:'button'},'Comenzar el examen');
    b.onclick=async()=>{b.disabled=true;try{await T.db.collection('intentos').doc(id).set({inicio:new Date().toISOString(),estado:'en curso'})}catch(err){aviso('No se pudo iniciar el examen.');b.disabled=false;return}T.intentos[id]={inicio:new Date().toISOString(),estado:'en curso'};vistaConvocatoria(id)};
    cuerpo.append(h('div',{class:'aviso'},'Al pulsar «Comenzar» empieza a contar el tiempo ('+(c.duracion_min||'—')+' minutos, sin pasar del cierre de la ventana). Al agotarse, las respuestas se entregan solas.'),b);
  }else if(e==='en curso'){
    cuerpo.append(panelExamen(c,it,Math.min(z,Date.parse(it.inicio)+(c.duracion_min||1e6)*60000)));
  }else if(e==='entregada'){
    cuerpo.append(panelRevision(c,it,Date.now()>=z));

    cuerpo.append(h('p',{class:'vacio'},'La ventana de esta convocatoria se cerró sin que se presentara.'),panelRevision(c,{},true));
  }
  p.replaceChildren(cab,cuerpo);tipografiar(cuerpo);
}
function corregir(preg,resp){
  let ok=0;const fallos=[];
  preg.forEach((q,i)=>{let bien;
    if(q.tipo==='numero'){const t=String(resp[i]??'').replace(/[\s ]/g,'');const cands=t.includes(',')?[t.replace(/\./g,'').replace(',','.')]:[t,t.replace(/\./g,'')];const tol=(q.tolerancia||Math.abs(q.valor)*1e-3+1e-9);bien=cands.some(c=>{const v=parseFloat(c);return c!==''&&isFinite(v)&&Math.abs(v-q.valor)<=tol})}
    else bien=resp[i]===q.correcta;
    if(bien)ok++;else fallos.push({n:i+1,repasar:q.repasar||''})});
  return {ok,fallos};
}
function panelExamen(c,it,limite){
  T.enCurso=true;
  const caja=h('div');const resp={};const preg=c.preguntas||[];
  const reloj=h('b',{class:'num'});

  preg.forEach((q,i)=>{const nombre='cv-'+c.id+'-'+i;
    const b=h('div',{class:'preg'},h('div',{class:'enun'},h('b',{class:'num'},(i+1)+'.'),h('div',{html:q.enunciado})));
    if(q.tipo==='numero'){const inp=h('input',{type:'text',inputmode:'decimal',id:nombre});inp.oninput=()=>{resp[i]=inp.value};b.append(h('div',{class:'resp-num'},inp,q.unidad?h('span',{},q.unidad):null))}
    else b.append(h('div',{class:'opc'},q.opciones.map((o,j)=>{const r=h('input',{type:'radio',name:nombre,id:nombre+'-'+j});r.onchange=()=>{resp[i]=j};return h('label',{for:nombre+'-'+j},r,h('span',{class:'eti',style:'min-width:1.4em'},'('+'abcd'[j]+')'),h('span',{html:o}))})));
    lista.append(b)});
  const probs=(c.problemas||[]).length?h('div',{},h('h3',{class:'sec'},'Problemas para resolver a mano'),h('p',{class:'lectura'},'Resuélvalos en papel. Las soluciones se mostrarán al cerrarse la ventana para que se autocorrija.'),...c.problemas.map((pr,k)=>h('div',{class:'preg'},h('div',{class:'enun'},h('b',{},'P'+(k+1)+'.'),h('div',{html:pr.enunciado+(pr.puntos?' <span class="eti">('+pr.puntos+' p.)</span>':'')}))))):null;
  const bEnt=h('button',{class:'boton prim',type:'button'},'Entregar');
  let entregado=false;
  const entregar=async auto=>{if(entregado)return;entregado=true;clearInterval(iv);bEnt.disabled=true;
    const {ok,fallos}=corregir(preg,resp);const pp=c.puntos_por_pregunta||1;
    const d={inicio:it.inicio,fin:new Date().toISOString(),estado:'entregado',respuestas:preg.map((_,i)=>resp[i]??null),puntos:ok*pp,total:preg.length*pp,fallos,automatica:!!auto};
    try{await T.db.collection('intentos').doc(c.id).set(d)}catch(e){aviso('No se pudo guardar la entrega; vuelva a pulsar «Entregar».');entregado=false;bEnt.disabled=false;return}
    await guardarResultado('conv-'+c.id,'convocatoria',{puntos:d.puntos,total:d.total,fallos:fallos.map(f=>f.repasar).filter(Boolean)});
    T.intentos[c.id]=d;T.enCurso=false;vistaConvocatoria(c.id)};
  bEnt.onclick=()=>entregar(false);
  const tic=()=>{const d=limite-Date.now();if(d<=0){reloj.textContent='0:00';entregar(true);return}const mm=Math.floor(d/6e4),ss=Math.floor(d%6e4/1e3);reloj.textContent=mm+':'+String(ss).padStart(2,'0');reloj.style.color=d<5*6e4?'var(--mal)':''};
  const iv=setInterval(tic,1000);tic();T.limpiar=()=>{clearInterval(iv);T.enCurso=false};
  const marcador=h('div',{class:'marcador'},h('span',{},'Tiempo restante: ',reloj),h('span',{style:'flex:1'}),bEnt);
  caja.append(lista,probs,marcador);
  return caja;
}
function panelRevision(c,it,cerrada){
  const caja=h('div');const preg=c.preguntas||[];const resp=it.respuestas||[];
  if(it.estado==='entregado')caja.append(h('p',{class:'lectura'},'Calificación: ',h('b',{class:'num'},fmt(it.puntos)+' / '+fmt(it.total)),'. ',it.puntos>=(c.umbral||0.7)*it.total?h('span',{class:'e-bien'},'Superada.'):h('span',{class:'e-mal'},'No superada.'),it.automatica?' Entrega automática al agotarse el tiempo.':''));

      h('div',{class:'expl',html:'<i class="'+(ok?'e-bien':'e-mal')+'">'+(ok?'Correcta.':'Incorrecta.')+'</i> Su respuesta: '+esc(r==null?'—':(q.tipo==='numero'?r:'('+'abcd'[r]+')'))+'. Respuesta correcta: '+(q.tipo==='numero'?esc(fmt(q.valor))+(q.unidad?' '+esc(q.unidad):''):'('+'abcd'[q.correcta]+') '+q.opciones[q.correcta])+'. '+(q.explicacion||'')+(q.repasar?' <span class="eti">Repasar: '+esc(q.repasar)+'</span>':'')})))});
  if((c.problemas||[]).length)caja.append(h('h3',{class:'sec'},'Problemas: soluciones'),...c.problemas.map((pr,k)=>h('div',{class:'preg'},h('div',{class:'enun'},h('b',{},'P'+(k+1)+'.'),h('div',{html:pr.enunciado})),h('div',{class:'expl',html:pr.solucion||''}))));
  return caja;
}

function enrutar(){
  if(!S.datos)return;
  const tok=location.hash.slice(1)||'inicio';const [id,sub]=tok.split('-');
  if(T.limpiar){try{T.limpiar()}catch(e){}T.limpiar=null}
  pintarMenu();
  if(/^[MP]\d\d$/.test(id)&&modulo(id))vistaModulo(modulo(id),sub||ls.get(BASE_LOCAL+'tab-'+id,'apuntes'));
  else if(/^H\d$/.test(id)&&hito(id))vistaHito(hito(id),sub||ls.get(BASE_LOCAL+'tab-'+id,'examen'));
  else if(id==='descargas')vistaDescargas();
  else if(id==='convocatorias'){if(sub)vistaConvocatoria(tok.slice('convocatorias-'.length));else vistaConvocatorias()}
  else vistaInicio();
  window.scrollTo(0,0);
}
